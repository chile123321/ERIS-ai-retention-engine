[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eris-attrition-model-api"
version = "0.1.0"
description = "ERIS employee attrition modeling and inference service"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = ["pydantic>=2", "pydantic-settings>=2", "PyYAML>=6"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
# The historical tuning grid uses penalty, scheduled for removal in sklearn 1.10.
ml = ["pandas>=2", "numpy>=1.26,<2.5", "scipy>=1.11,<1.17", "scikit-learn>=1.4,<1.10", "joblib>=1.3", "matplotlib>=3.8"]
explain = ["shap>=0.50,<0.51", "xgboost>=2"]
manual-ui = ["streamlit==1.65.0"]
dev = [
    "pytest>=8", "httpx>=0.27", "ruff>=0.4", "mypy==2.3.1",
    "types-PyYAML==6.0.12.20260906", "pandas-stubs==3.0.5.260914",
    "scikit-learn-stubs==0.0.3", "scipy-stubs==1.16.3.3",
    "joblib-stubs==1.5.3.1.20260117",
    # Needed by the full strict typing/widget-test gate, not by the inference API.
    "streamlit==1.65.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["eris_ml"]
mypy_path = ["src", "typings"]
