[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eris-b2-model-api"
version = "1.0.0"
description = "ERIS frozen Random Forest B2 inference service"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.110", "uvicorn[standard]>=0.29",
    "pydantic>=2", "pydantic-settings>=2", "PyYAML>=6",
    "pandas>=2", "numpy>=1.26,<2.5", "scipy>=1.11,<1.17",
    "scikit-learn>=1.4,<1.10", "joblib>=1.3", "matplotlib>=3.8",
    "shap>=0.50,<0.51",
]

[project.optional-dependencies]
dev = [
    "pytest>=8", "httpx>=0.27", "ruff>=0.4", "mypy==2.3.1",
    "types-PyYAML==6.0.12.20260906", "pandas-stubs==3.0.5.260914",
    "scikit-learn-stubs==0.0.3", "scipy-stubs==1.16.3.3",
    "joblib-stubs==1.5.3.1.20260117",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["eris_ml"]
mypy_path = ["src", "typings"]
