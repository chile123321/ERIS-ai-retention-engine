[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eris-attrition-model-api"
version = "0.1.0"
description = "ERIS employee attrition modeling and inference service"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = ["pydantic>=2", "pydantic-settings>=2", "PyYAML>=6"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
ml = ["pandas>=2", "numpy>=1.26", "scikit-learn>=1.4", "joblib>=1.3"]
explain = ["shap>=0.45", "xgboost>=2"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.4", "mypy>=1.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["eris_ml"]
mypy_path = "src"
