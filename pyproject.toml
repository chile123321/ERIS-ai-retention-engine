[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eris-retention-engine"
version = "0.2.0"
description = "Dataset-neutral foundation for the ERIS employee-retention project"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0,<3",
    "pandas>=2.2,<4",
    "scikit-learn>=1.5,<2",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.15,<3",
    "pandas-stubs>=2.2",
    "pytest>=8,<10",
    "ruff>=0.11,<1",
    "scikit-learn-stubs>=0.0.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["eris_ml"]
mypy_path = ["src"]
