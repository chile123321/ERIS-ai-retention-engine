$kind: http-request
url: "{{base_url}}/v1/explain"
method: POST
headers:
  Content-Type: application/json
  X-ERIS-Service-Key: "{{service_key}}"
body:
  type: json
  content: |-
    {
      "reference_id": "synthetic-one",
      "features": {
        "Age": 35,
        "Department": "Research & Development",
        "DistanceFromHome": 5,
        "Education": 3,
        "EnvironmentSatisfaction": 3,
        "JobLevel": 2,
        "JobSatisfaction": 3,
        "MonthlyIncome": 5000,
        "OverTime": "No",
        "TotalWorkingYears": 10,
        "TrainingTimesLastYear": 3,
        "YearsAtCompany": 5,
        "YearsInCurrentRole": 3,
        "YearsSinceLastPromotion": 1,
        "YearsWithCurrManager": 3
      }
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", () => pm.response.to.have.status(200));
      pm.test("JSON response", () => pm.response.to.be.json);
      pm.test("Finite probability [0,1]", () => { const j=pm.response.json(); const rows=j.results || [j.result || j]; rows.forEach(r => {pm.expect(Number.isFinite(r.estimated_probability)).to.eql(true); pm.expect(r.estimated_probability).to.be.within(0,1);}); });
      pm.test("Frozen B2 metadata", () => { const j = pm.response.json(); const m = j.metadata || (j.result && j.result.metadata) || (j.results && j.results[0].metadata) || j; pm.expect(m.model_id).to.eql("rf-v3-final15-unweighted-b2"); pm.expect(m.model_status).to.eql("research_candidate"); pm.expect(m.independent_validation).to.eql(false); pm.expect(m.decision_support_only).to.eql(true); });
      pm.test("All fifteen SHAP features", () => { const j=pm.response.json(); pm.expect(j.contributions.length).to.eql(15); pm.expect(new Set(j.contributions.map(c=>c.feature)).size).to.eql(15); pm.expect(j.top_factors.length).to.be.at.most(5); pm.expect(j.explanation_space).to.eql("probability"); });
    language: text/javascript
order: 5000
