$kind: http-request
url: "{{base_url}}/v1/predict/batch"
method: POST
headers:
  Content-Type: application/json
  X-ERIS-Service-Key: "{{service_key}}"
body:
  type: json
  content: |-
    {
      "items": []
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 422", () => pm.response.to.have.status(422));
      pm.test("JSON response", () => pm.response.to.be.json);
    language: text/javascript
order: 8000
