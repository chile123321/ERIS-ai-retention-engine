$kind: http-request
url: "{{base_url}}/health"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", () => pm.response.to.have.status(200));
      pm.test("JSON response", () => pm.response.to.be.json);
      pm.test("Alive", () => pm.expect(pm.response.json().status).to.eql("ok"));
    language: text/javascript
order: 1000
