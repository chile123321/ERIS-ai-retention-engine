$kind: http-request
url: "{{base_url}}/ready"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 200", () => pm.response.to.have.status(200));
      pm.test("JSON response", () => pm.response.to.be.json);
      pm.test("Ready", () => pm.expect(pm.response.json().status).to.eql("ready"));
    language: text/javascript
order: 2000
