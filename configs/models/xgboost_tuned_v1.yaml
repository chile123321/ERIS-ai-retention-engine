model: xgboost
role: tuned_candidate
candidate_name: xgboost_tuned_v1
random_seed: 42
parameters:
  objective: binary:logistic
  eval_metric: logloss
  tree_method: hist
  scale_pos_weight: 1.0
  n_jobs: 1
  subsample: 0.6
  reg_lambda: 10.0
  reg_alpha: 0.5
  n_estimators: 500
  min_child_weight: 3
  max_depth: 1
  learning_rate: 0.1
  gamma: 0.5
  colsample_bytree: 0.6
