model: xgboost
search_type: randomized
scoring: average_precision
n_iter: 40
random_state: 42

fixed_parameters:
  objective: binary:logistic
  eval_metric: logloss
  tree_method: hist
  scale_pos_weight: 1.0
  n_jobs: 1
  random_state: 42

search_space:
  n_estimators:
    - 100
    - 200
    - 300
    - 500
    - 700
  max_depth:
    - 1
    - 2
    - 3
    - 4
  learning_rate:
    - 0.01
    - 0.03
    - 0.05
    - 0.08
    - 0.1
  min_child_weight:
    - 1
    - 3
    - 5
    - 10
  subsample:
    - 0.6
    - 0.8
    - 1.0
  colsample_bytree:
    - 0.6
    - 0.8
    - 1.0
  gamma:
    - 0.0
    - 0.1
    - 0.5
    - 1.0
  reg_alpha:
    - 0.0
    - 0.01
    - 0.1
    - 0.5
    - 1.0
  reg_lambda:
    - 1.0
    - 3.0
    - 5.0
    - 10.0
    - 20.0
