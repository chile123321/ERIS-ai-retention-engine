protocol_version: tuning-protocol-v1
primary_metric: average_precision
threshold: 0.5

outer_cv:
  type: StratifiedKFold
  n_splits: 5
  shuffle: true
  random_state: 42

inner_cv:
  type: StratifiedKFold
  n_splits: 4
  shuffle: true
  random_state: 43

search:
  error_score: raise
  return_train_score: true

execution:
  outer_parallelism: 1
  search_n_jobs: -1
  estimator_n_jobs: 1
