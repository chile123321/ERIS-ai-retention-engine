protocol_version: "1.0.0"
selection_data: development_only

cross_validation:
  n_splits: 5
  shuffle: true
  random_seed: 42

classification_threshold: 0.5

metrics:
  primary: average_precision
  ranking:
    - average_precision
    - roc_auc
  classification:
    - accuracy
    - balanced_accuracy
    - precision
    - recall
    - f1
    - f2
    - confusion_matrix
  probability:
    - brier_score

final_test:
  locked_until_release_candidate: true
